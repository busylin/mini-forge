seed: 42
device: cpu
paths:
  raw_dir: data/smoke_raw/ml-1m
  processed_dir: data/smoke_processed
  artifact_dir: artifacts/smoke
data:
  positive_rating: 1
  min_user_interactions: 3
  min_item_interactions: 1
  min_history: 2
  max_history: 5
  stride: 1
  i2i_window: 2
content:
  encoder: hashing
  output_dim: 32
  normalize: true
rqvae:
  input_dim: 32
  hidden_dim: 24
  latent_dim: 8
  num_codebooks: 2
  codebook_size: 8
  commitment_beta: 0.25
  i2i_weight: 0.05
  temperature: 0.1
  learning_rate: 0.003
  weight_decay: 0.0001
  batch_size: 16
  pair_batch_size: 16
  epochs: 2
  warmup_epochs: 0
  early_stop_patience: 2
  gradient_clip: 1.0
  validation_ratio: 0.2
  kmeans_iterations: 3
generator:
  d_model: 32
  d_ff: 64
  d_kv: 8
  encoder_layers: 1
  decoder_layers: 1
  heads: 4
  dropout: 0.0
  batch_size: 4
  gradient_accumulation: 1
  learning_rate: 0.001
  weight_decay: 0.0
  epochs: 1
  warmup_ratio: 0.0
  label_smoothing: 0.0
  early_stop_patience: 1
  gradient_clip: 1.0
  num_workers: 0
  validation_ranking: false
inference:
  num_beams: 3
  top_k: [1, 3]
  batch_size: 2
  remove_seen_items: true

