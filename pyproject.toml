[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-forge-rec"
version = "0.1.0"
description = "Public core for Semantic-ID generation and constrained generative recommendation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "requests>=2.31",
  "scipy>=1.11",
  "torch>=2.2",
  "transformers>=4.40,<5",
  "tqdm>=4.66",
]

[project.scripts]
mini-forge = "mini_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
